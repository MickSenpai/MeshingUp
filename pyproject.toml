[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshingup"
version = "0.1.0"
description = "Editor de rigging 2D y avatares 3D GLB/VRM con animación reactiva"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.7,<6.12", "Pillow>=10.0"]

[project.optional-dependencies]
inpaint = ["opencv-python-headless>=4.9"]
segmentation = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.57"]
rigging = ["opencv-python-headless>=4.9"]
decomposition = ["gradio_client>=1.6", "psd-tools>=1.9"]
avatar3d = ["PyQt6-WebEngine>=6.7,<6.12"]

[project.scripts]
meshingup = "meshingup.app:main"
meshingupctl = "meshingup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meshingup = ["viewer3d_static/*"]
